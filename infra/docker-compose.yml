# Local PostgreSQL for development. Start with `make db-up` (or
# `docker compose -f infra/docker-compose.yml up -d --wait`).
# Credentials are local-only defaults matching .env.example.
name: finpulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finpulse
      POSTGRES_PASSWORD: finpulse
      POSTGRES_DB: finpulse
    ports:
      # FINPULSE_DB_PORT: another host port when 5432 is taken or reserved (npm run demo picks one)
      - "127.0.0.1:${FINPULSE_DB_PORT:-5432}:5432"
    volumes:
      - finpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpulse -d finpulse"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  finpulse-db:
