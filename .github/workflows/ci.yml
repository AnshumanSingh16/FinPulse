name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finpulse
          POSTGRES_PASSWORD: finpulse
          POSTGRES_DB: finpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finpulse" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://finpulse:finpulse@localhost:5432/finpulse_test
      DATABASE_URL: postgresql://finpulse:finpulse@localhost:5432/finpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head && uv run alembic check

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    name: API contract up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked --project apps/api
      - run: npm ci
      - run: npm run contracts:generate
      - name: Fail if generated files differ from what is committed
        run: |
          git diff --exit-code -- packages/contracts || {
            echo "::error::OpenAPI or generated types are stale. Run 'npm run contracts:generate' and commit."
            exit 1
          }
